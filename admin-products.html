<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kelola Produk - Selara Admin</title>
<style>
:root{--rose:#9d174d;--magenta:#db2777;--pink:#fbcfe8;--blush:#fdf2f8;--ink:#1f1a1c;--muted:#7a6068;--line:#f3d1e3;--radius:16px;--font:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif'}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#eef1f5;color:var(--ink);display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:420px;background:#f8f9fb;min-height:100vh;position:relative;padding-bottom:80px;box-shadow:0 0 30px rgba(0,0,0,.1);overflow-x:hidden}
button{font:inherit;cursor:pointer;border:none;background:none}
.header{display:flex;align-items:center;gap:12px;padding:16px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.back-btn{width:34px;height:34px;border-radius:10px;background:var(--blush);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink);text-decoration:none}
.header-title{font-size:16px;font-weight:700}
.actions{display:flex;gap:10px;padding:16px 20px}
.search-box{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;outline:none}
.btn-add{background:var(--rose);color:#fff;padding:0 16px;border-radius:10px;font-size:12.5px;font-weight:700}
.list{padding:0 20px}
.p-card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--line);display:flex;gap:12px;align-items:center;position:relative}
.p-img{width:60px;height:60px;border-radius:10px;background:var(--blush);display:flex;align-items:center;justify-content:center;color:var(--rose);font-size:20px;overflow:hidden}
.p-img img{width:100%;height:100%;object-fit:cover}
.p-info{flex:1}
.p-name{font-size:13px;font-weight:800;margin-bottom:2px;padding-right:40px}
.p-price{font-size:12px;font-weight:800;color:var(--rose)}
.p-stats{font-size:10px;color:var(--muted);margin-top:4px}
.p-actions{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.btn-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--blush);border:1px solid var(--line)}
.btn-edit{color:var(--magenta)}
.btn-del{color:#dc2626}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;width:100%;max-width:420px;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h2{font-size:18px;font-weight:800}
.close{font-size:20px;color:var(--muted)}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:11.5px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.form-input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:13px;outline:none}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.img-preview{width:100%;height:120px;border:1.5px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;margin-bottom:8px;overflow:hidden;background:var(--blush)}
.img-preview img{width:100%;height:100%;object-fit:contain}
.btn-save{width:100%;padding:14px;background:var(--magenta);color:#fff;border-radius:12px;font-weight:800;font-size:14px;margin-top:10px}
.bottom-nav{position:fixed;bottom:0;width:100%;max-width:420px;background:#fff;border-top:1px solid var(--line);display:flex;padding:10px 0 14px;z-index:20}
.nav-item{flex:1;text-align:center;font-size:9.5px;color:var(--muted);font-weight:600;text-decoration:none}
.nav-item.active{color:var(--rose);font-weight:800}
.nav-item .ico{font-size:18px;display:block;margin-bottom:4px}
</style>
</head>
<body>
<div class="app">
  <div class="header"><a href="Admin.html" class="back-btn">←</a><div class="header-title">Kelola Produk</div></div>
  <div class="actions"><input type="text" class="search-box" id="searchInput" placeholder="Cari produk..." oninput="renderList()"><button class="btn-add" onclick="openModal()">＋ Tambah</button></div>
  <div class="list" id="productList"><div style="text-align:center; padding:30px; color:var(--muted); font-size:12px;">Memuat produk...</div></div>

  <div class="overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-head"><h2 id="modalTitle">Tambah Produk</h2><button class="close" onclick="closeModal()">✕</button></div>
      <form id="productForm">
        <input type="hidden" id="pId">
        <input type="hidden" id="pOldImage">
        
        <div class="form-group">
          <label class="form-label">Foto Produk</label>
          <div class="img-preview" id="imgPreview">Belum ada foto</div>
          <input type="file" id="pFile" style="font-size:11px;" accept="image/*" onchange="previewImage(event)">
        </div>
        <div class="form-group"><label class="form-label">Nama Produk *</label><input type="text" class="form-input" id="pName" required></div>
        <div class="form-group">
          <label class="form-label">Kategori (ID) *</label>
          <select class="form-input" id="pCategoryId" required>
            <option value="">Pilih Kategori</option>
            <option value="1">Tumbler (ID: 1)</option>
            <option value="2">Tempat Makan (ID: 2)</option>
          </select>
        </div>
        <div class="row-2">
          <div class="form-group"><label class="form-label">Harga Jual *</label><input type="number" class="form-input" id="pPrice" required></div>
          <div class="form-group"><label class="form-label">Harga Modal *</label><input type="number" class="form-input" id="pCost" required></div>
        </div>
        <div class="form-group">
          <label class="form-label">Ukuran (Pisahkan dengan koma)</label>
          <input type="text" class="form-input" id="pSizes" placeholder="500ml, 750ml">
        </div>
        <div class="form-group">
          <label class="form-label">Warna (Pisahkan dengan koma)</label>
          <input type="text" class="form-input" id="pColors" placeholder="Pink, Ungu, Biru">
        </div>
        <div class="form-group" style="display:flex; justify-content:space-between; align-items:center; background:var(--blush); padding:12px; border-radius:10px; border:1px solid var(--line);">
          <div><label class="form-label" style="margin:0;">Bisa Custom Nama</label></div>
          <input type="checkbox" id="pCustom" style="width:20px; height:20px; accent-color:var(--magenta);">
        </div>
        <div class="form-group"><label class="form-label">Deskripsi</label><textarea class="form-input" id="pDesc" rows="3"></textarea></div>
        <button type="submit" class="btn-save" id="btnSave">Simpan Produk</button>
      </form>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="Admin.html" class="nav-item"><span class="ico">📊</span>Dashboard</a>
    <a href="#" class="nav-item"><span class="ico">📋</span>Order</a>
    <a href="#" class="nav-item active"><span class="ico">🛍️</span>Produk</a>
    <a href="#" class="nav-item"><span class="ico">💰</span>Profit</a>
  </div>
</div>

<script src="/runtime-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  function getConfig(){var c1=window.SELARA_CONFIG||null;var c2=window.__SELARA_CONFIG__||window.SELARA_CONFIG__||null;var c=c1||c2||{};return {url:c.supabaseUrl||c.SUPABASE_URL||"",key:c.supabaseAnonKey||c.SUPABASE_ANON_KEY||""};}
  const CONFIG = getConfig(); let supabaseClient = null;
  if (CONFIG.url && CONFIG.key) { supabaseClient = window.supabase.createClient(CONFIG.url, CONFIG.key); }

  let allProducts = [];
  const fmt = (n) => 'Rp ' + Number(n).toLocaleString('id-ID');

  async function loadProducts() {
    if (!supabaseClient) return;
    try {
      const { data, error } = await supabaseClient.from('products').select('*, categories(name)').order('created_at', { ascending: false });
      if (error) throw error;
      allProducts = data || [];
      renderList();
    } catch (err) { document.getElementById('productList').innerHTML = `<div style="color:red; padding:20px;">Error: ${err.message}</div>`; }
  }

  function renderList() {
    const listEl = document.getElementById('productList');
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allProducts.filter(p => p.name.toLowerCase().includes(search));

    if (filtered.length === 0) { listEl.innerHTML = '<div style="text-align:center; padding:30px; color:var(--muted);">Produk tidak ditemukan.</div>'; return; }

    listEl.innerHTML = filtered.map(p => `
      <div class="p-card">
        <div class="p-img">${p.image_url ? `<img src="${p.image_url}">` : '📦'}</div>
        <div class="p-info">
          <div class="p-name">${p.name}</div>
          <div class="p-price">${fmt(p.price)}</div>
          <div class="p-stats">${p.categories?.name || 'Tanpa Kategori'}</div>
        </div>
        <div class="p-actions">
          <button class="btn-icon btn-edit" onclick="editProduct('${p.id}')">✏️</button>
          <button class="btn-icon btn-del" onclick="deleteProduct('${p.id}')">🗑️</button>
        </div>
      </div>
    `).join('');
  }

  function previewImage(event) {
    const file = event.target.files[0];
    if (file) { const reader = new FileReader(); reader.onload = (e) => { document.getElementById('imgPreview').innerHTML = `<img src="${e.target.result}">`; }; reader.readAsDataURL(file); }
  }

  document.getElementById('productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnSave'); btn.innerText = 'Menyimpan...'; btn.disabled = true;
    const id = document.getElementById('pId').value;
    const oldImage = document.getElementById('pOldImage').value;
    const file = document.getElementById('pFile').files[0];
    let imageUrl = oldImage;

    try {
      if (file) {
        const fileName = `produk-${Date.now()}.${file.name.split('.').pop()}`;
        const { error: uploadError } = await supabaseClient.storage.from('product-images').upload(fileName, file);
        if (uploadError) throw new Error("Gagal upload foto: " + uploadError.message);
        const { data: publicUrl } = supabaseClient.storage.from('product-images').getPublicUrl(fileName);
        imageUrl = publicUrl.publicUrl;
      }

      // Array parsing: "Pink, Ungu" -> ["Pink", "Ungu"]
      const sizesArray = document.getElementById('pSizes').value.split(',').map(s=>s.trim()).filter(Boolean);
      const colorsArray = document.getElementById('pColors').value.split(',').map(s=>s.trim()).filter(Boolean);

      const productData = {
        name: document.getElementById('pName').value,
        category_id: document.getElementById('pCategoryId').value || null,
        price: Number(document.getElementById('pPrice').value),
        cost_price: Number(document.getElementById('pCost').value),
        can_custom: document.getElementById('pCustom').checked,
        sizes: sizesArray.length ? sizesArray : null,
        colors: colorsArray.length ? colorsArray : null,
        description: document.getElementById('pDesc').value,
        image_url: imageUrl || null
      };

      let error;
      if (id) { const res = await supabaseClient.from('products').update(productData).eq('id', id); error = res.error; }
      else { const res = await supabaseClient.from('products').insert([productData]); error = res.error; }
      if (error) throw error;

      alert(id ? 'Produk diupdate!' : 'Produk ditambahkan!');
      closeModal(); loadProducts();
    } catch (err) { alert('Gagal: ' + err.message); } 
    finally { btn.innerText = 'Simpan Produk'; btn.disabled = false; }
  });

  function editProduct(id) {
    const p = allProducts.find(item => item.id === id);
    if (!p) return;
    document.getElementById('modalTitle').innerText = 'Edit Produk';
    document.getElementById('pId').value = p.id;
    document.getElementById('pOldImage').value = p.image_url || '';
    document.getElementById('pName').value = p.name;
    document.getElementById('pCategoryId').value = p.category_id || '';
    document.getElementById('pPrice').value = p.price;
    document.getElementById('pCost').value = p.cost_price;
    document.getElementById('pSizes').value = p.sizes ? p.sizes.join(', ') : '';
    document.getElementById('pColors').value = p.colors ? p.colors.join(', ') : '';
    document.getElementById('pCustom').checked = p.can_custom;
    document.getElementById('pDesc').value = p.description || '';
    document.getElementById('imgPreview').innerHTML = p.image_url ? `<img src="${p.image_url}">` : 'Belum ada foto';
    document.getElementById('pFile').value = '';
    openModal();
  }

  async function deleteProduct(id) {
    if (!confirm('Yakin mau hapus?')) return;
    try { const { error } = await supabaseClient.from('products').delete().eq('id', id); if (error) throw error; loadProducts(); } 
    catch (err) { alert('Gagal: ' + err.message); }
  }

  function openModal() { document.getElementById('modalOverlay').classList.add('open'); }
  function closeModal() { 
    document.getElementById('modalOverlay').classList.remove('open'); 
    document.getElementById('productForm').reset();
    document.getElementById('pId').value = ''; document.getElementById('pOldImage').value = '';
    document.getElementById('imgPreview').innerHTML = 'Belum ada foto';
    document.getElementById('modalTitle').innerText = 'Tambah Produk';
  }

  loadProducts();
</script>
</body>
</html>
